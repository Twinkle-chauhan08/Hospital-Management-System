<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Medicare">
  <defs>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Soft backdrop -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="#FFFFFF"/>

  <!-- Medical cross -->
  <rect x="24" y="50" width="80" height="28" rx="8" fill="url(#gGreen)"/>
  <rect x="50" y="24" width="28" height="80" rx="8" fill="url(#gGreen)"/>

  <!-- Center pillar (blue) -->
  <rect x="55.5" y="28" width="17" height="72" rx="8.5" fill="url(#gBlue)" opacity="0.95"/>

  <!-- Stethoscope: tube + chestpiece -->
  <path d="M40 46
           C36 52, 35 61, 40 68
           C46 77, 60 82, 74 79
           C90 76, 100 66, 98 56"
        fill="none" stroke="url(#gBlue)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M86 33
           C80 30, 72 30, 66 33"
        fill="none" stroke="#8BE7D2" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Earpiece arc -->
  <path d="M86 30
           C95 39, 95 52, 86 60"
        fill="none" stroke="#7ADCC8" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Chestpiece -->
  <circle cx="38" cy="70" r="7.2" fill="none" stroke="url(#gBlue)" stroke-width="6"/>
  <circle cx="38" cy="70" r="2.2" fill="#0EA5E9" opacity="0.9"/>
</svg>

