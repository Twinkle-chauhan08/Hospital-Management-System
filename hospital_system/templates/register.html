<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Medicare Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #16A34A;
            --green-light: #22C55E;
            --green-pale: #DCFCE7;
            --green-mid: #BBF7D0;
            --green-dark: #14532D;
            --gray-400: #9CA3AF;
            --gray-600: #4B5563;
            --gray-800: #1F2937;
            --off-white: #F0FDF4;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                linear-gradient(135deg, rgba(220, 252, 231, 0.9) 0%, rgba(255, 255, 255, 0.88) 65%),
                url('https://images.unsplash.com/photo-1530026405186-ed1f139313f8?auto=format&fit=crop&q=80&w=1800') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 40px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 560px;
            animation: fadeUp 0.45s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--green), var(--green-light));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 12px;
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.3);
            color: white;
        }

        .logo-text {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            color: var(--green-dark);
            margin-bottom: 4px;
            text-align: center;
        }

        .logo-subtext {
            color: var(--gray-400);
            font-size: 13px;
            text-align: center;
            margin-bottom: 32px;
        }

        .card {
            background: #ffffff;
            border-radius: 20px;
            border: 1.5px solid var(--green-mid);
            box-shadow: 0 1px 8px rgba(22, 163, 74, 0.06);
            padding: 32px;
        }

        .card-title {
            font-family: 'Fraunces', serif;
            font-size: 20px;
            color: var(--green-dark);
            margin-bottom: 6px;
            text-align: center;
        }

        .card-subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--gray-400);
            margin-bottom: 24px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 5px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid var(--green-mid);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fff;
            color: var(--gray-800);
            transition: all 0.2s;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
            color: var(--gray-800);
        }

        .btn-green {
            background: var(--green);
            color: #fff;
            padding: 12px 22px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(22, 163, 74, 0.3);
        }

        .btn-green:hover {
            background: #15803D;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.35);
            color: white;
        }

        .text-muted {
            color: var(--gray-600) !important;
            font-size: 13px;
        }

        .link-green {
            color: var(--green);
            font-weight: 700;
            text-decoration: none;
        }

        .link-green:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            border: none;
        }

        .input-group-text {
            background-color: var(--off-white);
            border: 1.5px solid var(--green-mid);
            border-right: none;
            color: var(--green);
        }

        .has-icon .form-control {
            border-left: none;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="text-center">
            <div class="logo-box" style="background: transparent; box-shadow: none; width: 84px; height: 84px; display:flex; align-items:center; justify-content:center;">
                <img src="{{ url_for('static', filename='img/medicare_logo_full.svg') }}" alt="Medicare" style="max-width: 240px; height: 84px;">
            </div>
            <h1 class="logo-text" style="display:none">Medicare</h1>
            <p class="logo-subtext">Hospital Management System</p>
        </div>

        <div class="card shadow-sm">
            <h2 class="card-title">Patient Registration</h2>
            <p class="card-subtitle">Create your Medicare patient account</p>

            {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="alert alert-success">
                <i class="fas fa-check-circle me-1"></i> {{ success }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="row g-3 mb-3">
                    <div class="col-md-8">
                        <label class="form-label">Full Name</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" name="name" placeholder="Full name" required
                                   pattern="[A-Za-z ]+"
                                   title="Name must contain only letters and spaces.">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-hashtag"></i></span>
                            <input type="number" class="form-control" name="age" placeholder="Age" min="1" max="120" required>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Blood Group</label>
                        <select class="form-select" name="blood_group" required>
                            <option value="">Select Blood Group</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" name="email" placeholder="Email" required
                                   pattern="[a-zA-Z0-9._%+-]+@gmail\.com$"
                                   title="Please enter a valid Gmail address (e.g., user@gmail.com).">
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-phone"></i></span>
                            <input type="tel" class="form-control" name="phone" placeholder="Phone" required
                                   pattern="[0-9]{10}"
                                   title="Phone number must be exactly 10 digits.">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <div class="input-group has-icon">
                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                        <input type="text" class="form-control" name="address" placeholder="Full Address" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Medical Condition</label>
                    <select class="form-select" name="disease" required>
                        <option value="">Primary medical condition</option>
                        <option value="Heart Disease">Heart Disease</option>
                        <option value="Diabetes">Diabetes</option>
                        <option value="Bone Disorder">Bone Disorder</option>
                        <option value="Skin Disease">Skin Disease</option>
                        <option value="High Blood Pressure">High Blood Pressure</option>
                        <option value="Asthma">Asthma</option>
                        <option value="Cancer">Cancer</option>
                        <option value="General Checkup">General Checkup</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group has-icon">
                        <span class="input-group-text"><i class="fas fa-user-circle"></i></span>
                        <input type="text" class="form-control" name="username" placeholder="Username" required
                               pattern="[A-Za-z]+"
                               title="Username must contain only alphabetic characters.">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" class="form-control" name="password" 
                                   placeholder="Min. 8 chars, 1 num, 1 special"
                                   pattern="^(?=.*[0-9])(?=.*[!@#$%^&*(),.?\&quot;:{}|<>]).{8,}$"
                                   title="Password must be at least 8 characters long, contain at least one numeric character and one special character."
                                   required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirm</label>
                        <div class="input-group has-icon">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" name="confirm_password" 
                                   placeholder="Confirm"
                                   pattern="^(?=.*[0-9])(?=.*[!@#$%^&*(),.?\&quot;:{}|<>]).{8,}$"
                                   required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-green">Register as Patient</button>
            </form>

            <p class="text-center text-muted mb-0">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="link-green">Sign in</a>
            </p>
        </div>

        <p class="text-center mt-4">
            <a href="{{ url_for('main.home') }}" class="link-green" style="font-size: 13px;">← Back to Home</a>
        </p>
    </div>
</body>
</html>
