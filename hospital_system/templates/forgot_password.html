<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Medicare Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --green: #16A34A;
            --green-light: #22C55E;
            --green-pale: #DCFCE7;
            --green-mid: #BBF7D0;
            --green-dark: #14532D;
            --gray-400: #9CA3AF;
            --gray-600: #4B5563;
            --gray-800: #1F2937;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background:
                linear-gradient(135deg, rgba(220, 252, 231, 0.9) 0%, rgba(255, 255, 255, 0.88) 65%),
                url('https://images.unsplash.com/photo-1584982751601-97dcc096659c?auto=format&fit=crop&q=80&w=1800') center/cover no-repeat fixed;
            min-height: 100vh;
            margin: 0;
            padding: 30px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .forgot-shell {
            width: 100%;
            max-width: 1020px;
            animation: fadeUp 0.45s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .forgot-card {
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            border: 1.5px solid var(--green-mid);
            box-shadow: 0 16px 40px rgba(22, 163, 74, 0.12);
        }

        .left-panel {
            padding: 42px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--green), var(--green-light));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 18px rgba(22, 163, 74, 0.32);
        }

        .brand-name {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            color: var(--green-dark);
        }

        .title {
            font-family: 'Fraunces', serif;
            font-size: 34px;
            line-height: 1.2;
            color: var(--green-dark);
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--gray-600);
            margin-bottom: 26px;
            font-size: 15px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-control {
            padding: 12px 14px;
            border: 1.5px solid var(--green-mid);
            border-radius: 12px;
            font-size: 14px;
        }

        .form-control:focus {
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .btn-green {
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 4px 14px rgba(22, 163, 74, 0.28);
        }

        .btn-green:hover {
            background: #15803D;
            color: #fff;
        }

        .right-panel {
            min-height: 620px;
            background:
                linear-gradient(180deg, rgba(20, 83, 45, 0.08), rgba(20, 83, 45, 0.28)),
                url('https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&q=80&w=1400') center/cover no-repeat;
            position: relative;
        }

        .right-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.15), rgba(255, 255, 255, 0.08));
        }

        .helper-box {
            position: absolute;
            bottom: 24px;
            left: 24px;
            right: 24px;
            z-index: 2;
            color: #fff;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 14px;
            backdrop-filter: blur(3px);
        }

        .helper-box h6 {
            margin: 0 0 6px 0;
            font-size: 15px;
            font-weight: 700;
        }

        .helper-box p {
            margin: 0;
            font-size: 13px;
            opacity: 0.95;
        }

        @media (max-width: 991.98px) {
            .left-panel {
                padding: 28px;
            }
            .title {
                font-size: 28px;
            }
            .right-panel {
                min-height: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-shell">
        <div class="forgot-card">
            <div class="row g-0">
                <div class="col-lg-7 left-panel">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div class="brand">
                            <div class="brand-icon" style="background: transparent; box-shadow: none;">
                                <img src="{{ url_for('static', filename='img/medicare_mark.svg') }}" alt="Medicare" style="width: 36px; height: 36px;">
                            </div>
                            <div class="brand-name">Medicare</div>
                        </div>
                        <a href="{{ url_for('auth.login') }}" class="text-muted"><i class="fas fa-xmark"></i></a>
                    </div>

                    <h1 class="title">Reset Your Password</h1>
                    <p class="subtitle">Enter your username or email, set your new password, and continue to login securely.</p>

                    {% if error %}
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-1"></i> {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <div class="mb-3">
                            <label class="form-label" for="identifier">Username or Email</label>
                            <input type="text" class="form-control" id="identifier" name="identifier" placeholder="Enter username or email" value="{{ identifier or '' }}" autocomplete="username email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="new_password">New Password</label>
                            <input type="password" class="form-control" id="new_password" name="new_password" 
                                   placeholder="Min. 8 chars, 1 num, 1 special" 
                                   autocomplete="new-password" 
                                   pattern="^(?=.*[0-9])(?=.*[!@#$%^&*(),.?\&quot;:{}|<>]).{8,}$"
                                   title="Password must be at least 8 characters long, contain at least one numeric character and one special character."
                                   required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirm_password">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                   placeholder="Confirm new password" 
                                   autocomplete="new-password" 
                                   pattern="^(?=.*[0-9])(?=.*[!@#$%^&*(),.?\&quot;:{}|<>]).{8,}$"
                                   required>
                        </div>
                        <button type="submit" class="btn btn-green">Update Password</button>
                    </form>

                    <div class="mt-3 small text-muted">
                        Remembered password? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold" style="color: var(--green);">Back to Login</a>
                    </div>
                </div>

                <div class="col-lg-5 right-panel d-none d-lg-block">
                    <div class="helper-box">
                        <h6>Security Tip</h6>
                        <p>Use at least 8 characters with letters, numbers, and symbols for stronger account protection.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
