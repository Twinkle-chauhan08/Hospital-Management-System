<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Force desktop layout even on mobile devices -->
    <meta name="viewport" content="width=1200, initial-scale=1.0">
    <title>Medicare Hospital Management System</title>
    <!-- React and ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Base fonts already imported in the JS css string, but adding here too for safety */
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,500&display=swap');
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Inject Flask data and routes into the global window object
        window.FLASK_ROUTES = {
            login: "{{ url_for('auth.login') }}",
            register: "{{ url_for('auth.register') }}",
            logout: "{{ url_for('auth.logout') }}",
            dashboard: "{{ dashboard_url or '#' }}",
            profile: "{{ profile_url or (dashboard_url or '#') }}",
            home: "{{ url_for('main.home') }}",
            api_feedback: "{{ url_for('main.api_feedback') }}",
            api_live_stats: "{{ url_for('main.api_live_stats') }}",
            api_live_doctors: "{{ url_for('main.api_live_doctors') }}"
        };

        window.STATIC_ASSETS = {
            logo_mark: "{{ url_for('static', filename='img/medicare_mark.svg') }}",
            logo_full: "{{ url_for('static', filename='img/medicare_logo_full.svg') }}"
        };

        window.INIT_DATA = {
            doctors: {{ doctors | tojson | safe }},
            stats: {{ stats | tojson | safe }},
            feedbacks: {{ feedbacks | tojson | safe }},
            user_profile: {{ user_profile | tojson | safe if user_profile else 'null' }}
        };
    </script>

    <script type="text/babel">
        {% raw %}
        const { useState, useEffect, useRef } = React;

        // ─── STYLES ──────────────────────────────────────────────────────────────────
        const G = {
          green:     "#16A34A",
          greenLight:"#22C55E",
          greenPale: "#DCFCE7",
          greenMid:  "#BBF7D0",
          greenDark: "#14532D",
          white:     "#FFFFFF",
          offWhite:  "#F0FDF4",
          gray50:    "#F9FAFB",
          gray100:   "#F3F4F6",
          gray200:   "#E5E7EB",
          gray400:   "#9CA3AF",
          gray600:   "#4B5563",
          gray800:   "#1F2937",
          red:       "#EF4444",
          redPale:   "#FEE2E2",
          amber:     "#F59E0B",
          amberPale: "#FEF3C7",
          blue:      "#3B82F6",
          bluePale:  "#DBEAFE",
        };

           const css = `
             @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,600;1,500&display=swap');
             * { box-sizing: border-box; margin: 0; padding: 0; }
             html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; }
             body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F0FDF4; }
             img { max-width: 100%; height: auto; }
             ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #BBF7D0; border-radius: 8px; }

          @keyframes fadeUp   { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
          @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
          @keyframes pulse    { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
          @keyframes slideIn  { from { transform:translateX(-16px); opacity:0; } to { transform:translateX(0); opacity:1; } }

          .fade-up  { animation: fadeUp  0.45s ease both; }
          .fade-in  { animation: fadeIn  0.3s ease both; }
          .slide-in { animation: slideIn 0.35s ease both; }

          .btn { padding:9px 22px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; cursor:pointer; transition:all 0.18s; font-family:inherit; }
          .btn-green  { background:#16A34A; color:#fff; box-shadow:0 3px 10px rgba(22,163,74,0.3); }
          .btn-green:hover  { background:#15803D; transform:translateY(-1px); box-shadow:0 6px 16px rgba(22,163,74,0.35); }
          .btn-ghost  { background:transparent; color:#16A34A; border:2px solid #BBF7D0; }
          .btn-ghost:hover  { background:#DCFCE7; }
          .btn-red    { background:#EF4444; color:#fff; }
          .btn-red:hover    { background:#DC2626; transform:translateY(-1px); }
          .btn-sm     { padding:6px 14px; font-size:12px; border-radius:8px; }

          .input { width:100%; padding:10px 14px; border:1.5px solid #D1FAE5; border-radius:10px; font-size:14px; font-family:inherit; outline:none; background:#fff; color:#1F2937; transition:border 0.2s; }
          .input:focus { border-color:#16A34A; box-shadow:0 0 0 3px rgba(22,163,74,0.1); }
          .label { font-size:12.5px; font-weight:700; color:#374151; margin-bottom:5px; display:block; text-transform:uppercase; letter-spacing:0.04em; }

          .card { background:#fff; border-radius:16px; border:1.5px solid #D1FAE5; box-shadow:0 1px 8px rgba(22,163,74,0.06); }
          .card-hover:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(22,163,74,0.12); transition:all 0.2s; }

          .nav-item { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; cursor:pointer; font-size:14px; font-weight:600; color:#4B5563; transition:all 0.18s; margin-bottom:3px; }
          .nav-item:hover  { background:#DCFCE7; color:#16A34A; }
          .nav-item.active { background:linear-gradient(135deg,#16A34A,#15803D); color:#fff; box-shadow:0 4px 14px rgba(22,163,74,0.3); }

          .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
          .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); z-index:1000; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s ease; }
          .modal    { background:#fff; border-radius:20px; padding:32px; width:90%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,0.18); animation:fadeUp 0.3s ease; }
          .table-head { display:grid; padding:10px 18px; background:#F0FDF4; border-bottom:1.5px solid #D1FAE5; font-size:11px; font-weight:800; color:#16A34A; text-transform:uppercase; letter-spacing:0.06em; }
          .table-row  { display:grid; padding:13px 18px; border-bottom:1px solid #F0FDF4; font-size:13.5px; align-items:center; transition:background 0.15s; }
          .table-row:hover { background:#F0FDF4; }
          .avatar { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; }
        `;

        // ═══════════════════════════════════════════════════════════════════════════════
        // LANDING PAGE
        // ═══════════════════════════════════════════════════════════════════════════════
        function LandingPage({ onLogin }) {
          const [openFaq, setOpenFaq] = useState(null);
          const [activeNav, setActiveNav] = useState("home");
          const [profileOpen, setProfileOpen] = useState(false);
          const [feedbackRating, setFeedbackRating] = useState(0);
          const [feedbackName, setFeedbackName] = useState("");
          const [feedbackEmail, setFeedbackEmail] = useState("");
          const [feedbackText, setFeedbackText] = useState("");
          const [feedbackLoading, setFeedbackLoading] = useState(false);
          const testimonialScrollRef = useRef(null);
          const profileMenuRef = useRef(null);

          // Use Flask stats if available
          const initialStats = window.INIT_DATA.stats || {
            patients: 0,
            doctors: 0,
            appointments: 0,
            completed_appointments: 0,
            years_of_trust: 1
          };
          const [liveStats, setLiveStats] = useState(initialStats);
          const doctorsFromDB = window.INIT_DATA.doctors || [];
          const [liveDoctors, setLiveDoctors] = useState(doctorsFromDB);
          const doctorScrollRef = useRef(null);

          useEffect(() => {
            const closeIfOutside = (e) => {
              if (!profileMenuRef.current) return;
              if (!profileMenuRef.current.contains(e.target)) setProfileOpen(false);
            };
            document.addEventListener("mousedown", closeIfOutside);
            document.addEventListener("touchstart", closeIfOutside, { passive: true });
            return () => {
              document.removeEventListener("mousedown", closeIfOutside);
              document.removeEventListener("touchstart", closeIfOutside);
            };
          }, []);

          const formatCompact = (value) => {
            const n = Number(value || 0);
            if (n >= 1000000) return `${(n / 1000000).toFixed(1)}M+`;
            if (n >= 1000) return `${(n / 1000).toFixed(1)}K+`;
            return `${n}+`;
          };

          useEffect(() => {
            const fetchLiveStats = async () => {
              try {
                const res = await fetch(window.FLASK_ROUTES.api_live_stats, { cache: "no-store" });
                const data = await res.json();
                if (res.ok && data.success && data.stats) {
                  setLiveStats(prev => ({ ...prev, ...data.stats }));
                }
              } catch (e) {
                // keep existing stats if API fails
              }
            };

            fetchLiveStats();
            const timer = setInterval(fetchLiveStats, 20000);
            return () => clearInterval(timer);
          }, []);

          useEffect(() => {
            const fetchLiveDoctors = async () => {
              try {
                const res = await fetch(window.FLASK_ROUTES.api_live_doctors, { cache: "no-store" });
                const data = await res.json();
                if (res.ok && data.success && Array.isArray(data.doctors)) {
                  setLiveDoctors(data.doctors);
                }
              } catch (e) {
                // keep current list if API fails
              }
            };

            fetchLiveDoctors();
            const timer = setInterval(fetchLiveDoctors, 20000);
            return () => clearInterval(timer);
          }, []);

          const faqs = [
            { q: "How do I book an appointment?", a: "Simply create a patient account, browse our doctors, and click 'Book Appointment'. You can choose your preferred date and time. The doctor will accept or schedule your visit." },
            { q: "Is my medical data secure?", a: "Absolutely. Medicare uses role-based access control — only your assigned doctor can view your health records. Admin and receptionists only see scheduling information." },
            { q: "Can I see my health progress over time?", a: "Yes! Your patient dashboard shows all your medical records, diagnoses, prescriptions, and doctor notes in one place so you can track your health journey." },
            { q: "How does the receptionist book for walk-in patients?", a: "Receptionists can register new patients directly in the system and immediately book an appointment with any available doctor — all in under 2 minutes." },
            { q: "What happens after a doctor accepts my appointment?", a: "You'll see the status change to 'Accepted' in your dashboard. After your visit, the doctor logs your diagnosis and prescription, which appears instantly in your health records." },
            { q: "Can I change or cancel an appointment?", a: "Yes. From your patient dashboard you can view all upcoming appointments. Contact the receptionist desk or use the system to reschedule as needed." },
          ];

          const services = [
            { icon: "❤️", title: "Cardiology",    desc: "Expert heart care with advanced diagnostics, ECG, and treatment for all cardiac conditions." },
            { icon: "🧠", title: "Neurology",     desc: "Comprehensive neurological care from migraines and strokes to complex nerve disorders." },
            { icon: "🦴", title: "Orthopedics",   desc: "Joint replacements, fracture care, sports injuries, and complete bone health management." },
            { icon: "👶", title: "Pediatrics",    desc: "Compassionate, specialized care for newborns, children, and teenagers." },
            { icon: "🔬", title: "Diagnostics",   desc: "Full in-house lab, MRI, CT scan, X-ray, and pathology — results in hours, not days." },
            { icon: "🚑", title: "Emergency",     desc: "24/7 trauma centre with rapid response teams and fully equipped emergency bays." },
            { icon: "👁️", title: "Ophthalmology", desc: "Complete eye care including cataract surgery, glaucoma, LASIK consultations and more." },
            { icon: "🦷", title: "Dental Care",   desc: "From routine cleanings to orthodontics and implants — your smile is in good hands." },
          ];

          const team = (liveDoctors || []).map(d => ({
            name: d.name,
            role: d.specialization,
            exp: d.experience_years + " yrs",
            init: d.name.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase(),
            hue: 142 + (d.doctor_id * 30) % 200, // Generate a unique hue
            available: d.available,
            photo_url: d.photo_url || null,
            detail: d.available
              ? `${d.specialization} specialist with ${d.experience_years} years experience. Available for consultation.`
              : `${d.specialization} specialist with ${d.experience_years} years experience. Currently not available.`
          }));

          const user = window.INIT_DATA.user_profile || null;
          const userInit = user && user.name ? user.name.split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase() : "U";

          const defaultTestimonials = [
            { name: "Ramesh Gupta",    text: "Medicare's system is incredible. I booked an appointment in 2 minutes and my doctor had all my records ready. Truly world-class care.", role: "Patient", init: "RG" },
            { name: "Dr. Nita Bose",   text: "As a doctor, the treatment workflow is seamless. I can accept appointments, log diagnoses, and track my patients all in one dashboard.", role: "Doctor", init: "NB" },
            { name: "Kavya Srinivasan",text: "I was nervous about a new hospital, but the staff and system made everything so easy. My health progress is right there on my phone.", role: "Patient", init: "KS" },
          ];

          const dbFeedbacks = (window.INIT_DATA.feedbacks || []).map(f => ({
            id: `db-${f.feedback_id}`,
            name: f.name,
            text: f.feedback_text,
            role: "Patient",
            init: (f.name || "P").split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase(),
            rating: Math.max(1, Math.min(5, Number(f.rating || 5)))
          }));

          const [testimonials, setTestimonials] = useState([
            ...dbFeedbacks,
            ...defaultTestimonials.map((t, i) => ({ id: `default-${i}`, ...t, rating: 5 }))
          ].slice(0, 9));

          useEffect(() => {
            const el = testimonialScrollRef.current;
            if (!el || testimonials.length === 0) return;

            let rafId;
            let lastTime = performance.now();
            const speed = 35; // pixels per second

            const animate = (currentTime) => {
              const deltaTime = (currentTime - lastTime) / 1000;
              lastTime = currentTime;

              const loopWidth = el.scrollWidth / 2;
              if (loopWidth > 0) {
                let newScroll = el.scrollLeft + speed * deltaTime;
                if (newScroll >= loopWidth) {
                  newScroll -= loopWidth;
                }
                el.scrollLeft = newScroll;
              }
              rafId = requestAnimationFrame(animate);
            };

            rafId = requestAnimationFrame(animate);

            const onEnter = () => cancelAnimationFrame(rafId);
            const onLeave = () => {
              lastTime = performance.now();
              rafId = requestAnimationFrame(animate);
            };

            el.addEventListener('mouseenter', onEnter);
            el.addEventListener('mouseleave', onLeave);

            return () => {
              cancelAnimationFrame(rafId);
              el.removeEventListener('mouseenter', onEnter);
              el.removeEventListener('mouseleave', onLeave);
            };
          }, [testimonials.length]);

          useEffect(() => {
            const el = doctorScrollRef.current;
            if (!el || team.length === 0) return;

            let rafId;
            let lastTime = performance.now();
            const speed = 35; // pixels per second

            const animate = (currentTime) => {
              const deltaTime = (currentTime - lastTime) / 1000;
              lastTime = currentTime;

              const loopWidth = el.scrollWidth / 2;
              if (loopWidth > 0) {
                let newScroll = el.scrollLeft + speed * deltaTime;
                if (newScroll >= loopWidth) {
                  newScroll -= loopWidth;
                }
                el.scrollLeft = newScroll;
              }
              rafId = requestAnimationFrame(animate);
            };

            rafId = requestAnimationFrame(animate);

            const onEnter = () => cancelAnimationFrame(rafId);
            const onLeave = () => {
              lastTime = performance.now();
              rafId = requestAnimationFrame(animate);
            };

            el.addEventListener('mouseenter', onEnter);
            el.addEventListener('mouseleave', onLeave);

            return () => {
              cancelAnimationFrame(rafId);
              el.removeEventListener('mouseenter', onEnter);
              el.removeEventListener('mouseleave', onLeave);
            };
          }, [team.length]);

          useEffect(() => {
            const observer = new IntersectionObserver(
              (entries) => {
                entries.forEach((entry) => {
                  if (entry.isIntersecting) entry.target.classList.add("is-visible");
                });
              },
              { threshold: 0.12 }
            );

            document.querySelectorAll(".reveal-up").forEach((el) => observer.observe(el));
            return () => observer.disconnect();
          }, []);

          const submitFeedback = async () => {
            if (!feedbackName.trim() || !feedbackText.trim() || feedbackRating < 1) {
              window.alert("Please enter name, feedback and select star rating.");
              return;
            }

            setFeedbackLoading(true);
            try {
              const res = await fetch(window.FLASK_ROUTES.api_feedback, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  name: feedbackName.trim(),
                  email: feedbackEmail.trim(),
                  rating: feedbackRating,
                  feedback_text: feedbackText.trim()
                })
              });
              const data = await res.json();

              if (!res.ok || !data.success) {
                window.alert(data.error || "Could not submit feedback.");
                setFeedbackLoading(false);
                return;
              }

              const f = data.feedback;
              const newCard = {
                id: `db-${f.feedback_id}`,
                name: f.name,
                text: f.feedback_text,
                role: "Patient",
                init: (f.name || "P").split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase(),
                rating: Math.max(1, Math.min(5, Number(f.rating || 5)))
              };

              setTestimonials(prev => [newCard, ...prev.filter(x => x.id !== newCard.id)].slice(0, 9));
              setFeedbackName("");
              setFeedbackEmail("");
              setFeedbackText("");
              setFeedbackRating(0);
              window.alert("Feedback submitted successfully. Thank you!");
            } catch (err) {
              window.alert("Could not submit feedback right now.");
            } finally {
              setFeedbackLoading(false);
            }
          };

          const whyUs = [
            { icon: "🏆", title: "25 Years of Excellence",    desc: "Trusted by over 50,000 families across the region with a legacy of outstanding care." },
            { icon: "👨‍⚕️", title: "80+ Expert Specialists",  desc: "Our doctors are among the best in their fields, with international training and experience." },
            { icon: "⚡", title: "Fast & Seamless Booking",   desc: "Book, reschedule, and track appointments from anywhere — no waiting in lines." },
            { icon: "🔒", title: "Secure Health Records",     desc: "Your data is protected with role-based access. Only the right people see the right information." },
            { icon: "📱", title: "Real-Time Patient Portal",  desc: "Patients can track diagnoses, prescriptions, and doctor notes in real time from their dashboard." },
            { icon: "🌙", title: "24/7 Emergency Care",       desc: "Round-the-clock emergency services with a fully staffed trauma centre, every day of the year." },
          ];

          const navLinks = ["home","about","services","doctors","faqs","contact"];

          const scrollTo = (id) => {
            setActiveNav(id);
            document.getElementById(id)?.scrollIntoView({ behavior: "smooth" });
          };

           return (
             <div style={{ background: "#fff", fontFamily: "'Plus Jakarta Sans', sans-serif", color: G.gray800 }}>
              <style>{`
                @keyframes floatY { 0%,100%{transform:translateY(0px);} 50%{transform:translateY(-10px);} }
                @keyframes gradShift { 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
                .land-nav-link { font-size:14px; font-weight:600; color:#4B5563; cursor:pointer; padding:6px 14px; border-radius:8px; border:none; background:none; transition:all 0.18s; font-family:inherit; }
                .land-nav-link:hover { color:#16A34A; background:#DCFCE7; }
                .land-nav-link.active { color:#16A34A; }

                .hero-section {
                  padding: 0;
                }
                .land-nav {
                  padding: 16px 64px;
                }
                .land-nav-links {
                  display: flex;
                  gap: 4px;
                  overflow-x: auto;
                  scrollbar-width: none;
                }
                .land-nav-links::-webkit-scrollbar { display: none; }

                .profile-wrap { position: relative; }
                .profile-btn {
                  display:flex;
                  align-items:center;
                  gap:10px;
                  padding:8px 12px;
                  border-radius:14px;
                  border:1.5px solid #BBF7D0;
                  background:#fff;
                  cursor:pointer;
                  font-weight:800;
                  font-size:13px;
                  color:#14532D;
                  transition:all 0.16s;
                  white-space:nowrap;
                }
                .profile-btn:hover { background:#DCFCE7; }
                .profile-avatar {
                  width:32px;
                  height:32px;
                  border-radius:50%;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:12px;
                  font-weight:900;
                  color:#fff;
                  background: linear-gradient(135deg, #16A34A, #22C55E);
                  overflow:hidden;
                  flex-shrink:0;
                }
                .profile-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
                .profile-dd {
                  position:absolute;
                  right:0;
                  top: calc(100% + 10px);
                  width: 210px;
                  background:#fff;
                  border:1.5px solid #D1FAE5;
                  border-radius:16px;
                  box-shadow: 0 18px 44px rgba(0,0,0,0.14);
                  overflow:hidden;
                  z-index: 220;
                }
                .profile-dd button {
                  width:100%;
                  border:none;
                  background:#fff;
                  text-align:left;
                  padding:12px 14px;
                  font-weight:800;
                  font-size:13px;
                  color:#14532D;
                  cursor:pointer;
                  display:flex;
                  align-items:center;
                  gap:10px;
                }
                .profile-dd button:hover { background:#F0FDF4; }
                .profile-dd .danger { color:#B91C1C; }

                .hero-shell {
                  position: relative;
                  overflow: hidden;
                  border-radius: 0px;
                  background:
                    linear-gradient(115deg, rgba(10, 27, 18, 0.8) 0%, rgba(10, 27, 18, 0.55) 42%, rgba(22, 163, 74, 0.18) 100%),
                    url('https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&q=80&w=2200') center/cover no-repeat;
                  box-shadow: 0 20px 60px rgba(12, 44, 27, 0.25);
                  border: 1px solid rgba(34, 197, 94, 0.25);
                  min-height: calc(100vh - 84px);
                  min-height: calc(100svh - 84px);
                  display: flex;
                  align-items: center;
                }
                .hero-inner {
                  width: 100%;
                  max-width: 1280px;
                  margin: 0 auto;
                  padding: 86px 64px 96px;
                }
                .hero-grid {
                  display:grid;
                  grid-template-columns: 1.25fr 0.95fr;
                  gap: 34px;
                  align-items: center;
                }
                .hero-title {
                  font-family:'Fraunces',serif;
                  font-size: clamp(36px, 4.5vw, 62px);
                  font-weight: 600;
                  color: #fff;
                  line-height: 1.1;
                  margin-bottom: 16px;
                }
                .hero-card {
                  background: rgba(255,255,255,0.92);
                  border: 1px solid rgba(187, 247, 208, 0.9);
                  border-radius: 20px;
                  padding: 24px;
                  backdrop-filter: blur(4px);
                }
                .hero-mini {
                  display:grid;
                  grid-template-columns:1fr 1fr;
                  gap:10px;
                }
                .hero-mini > div {
                  background:#fff;
                  border:1px solid #D1FAE5;
                  border-radius:12px;
                  padding:12px;
                }
                @media (max-width: 992px) {
                  .hero-grid {
                    grid-template-columns: 1fr;
                  }
                  .hero-inner {
                    padding: 64px 22px 74px;
                  }
                }

                .brand-logo-home {

                  </div>
                  <div style={{ background:"#1a1a1a", borderRadius:24, padding:36, border:"1px solid #2a2a2a" }}>
                    <h3 style={{ fontFamily:"'Fraunces',serif", fontSize:22, color:"#fff", marginBottom:8 }}>Share Your Feedback</h3>
                    <p style={{ color:"#aaa", fontSize:13.5, marginBottom:20 }}>Rate your experience and help us improve our care.</p>

                    <div style={{ marginBottom:18 }}>
                      <div style={{ fontSize:12, color:G.greenLight, fontWeight:800, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:8 }}>Rating</div>
                      <div style={{ display:"flex", gap:4 }}>
                        {[1,2,3,4,5].map(star => (
                          <button
                            key={star}
                            type="button"
                            className="star-btn"
                            onClick={() => setFeedbackRating(star)}
                            aria-label={`Rate ${star} star`}
                            style={{ color: star <= feedbackRating ? "#F59E0B" : "#4B5563" }}
                          >
                            {'\u2605'}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div style={{ marginBottom:14 }}>
                      <input
                        className="contact-input"
                        type="text"
                        placeholder="Your Name"
                        value={feedbackName}
                        onChange={e => setFeedbackName(e.target.value)}
                        style={{ background:"#222", borderColor:"#333", color:"#fff" }}
                      />
                    </div>
                    <div style={{ marginBottom:14 }}>
                      <input
                        className="contact-input"
                        type="email"
                        placeholder="Email Address"
                        value={feedbackEmail}
                        onChange={e => setFeedbackEmail(e.target.value)}
                        style={{ background:"#222", borderColor:"#333", color:"#fff" }}
                      />
                    </div>
                    <div style={{ marginBottom:14 }}>
                      <textarea
                        className="contact-input"
                        rows={4}
                        placeholder="Write your feedback..."
                        value={feedbackText}
                        onChange={e => setFeedbackText(e.target.value)}
                        style={{ background:"#222", borderColor:"#333", color:"#fff", resize:"vertical" }}
                      />
                    </div>
                    <button
                      className="btn btn-green"
                      style={{ width:"100%", padding:14, fontSize:15 }}
                      onClick={submitFeedback}
                      disabled={feedbackLoading}
                    >
                      {feedbackLoading ? "Submitting..." : "Submit Feedback"}
                    </button>
                  </div>
                </div>
              </section>

              {/* ── FOOTER ── */}
              <footer className="land-pad" style={{ background:"#0a0a0a", borderTop:"1px solid #1a1a1a", padding:"60px 64px 32px", color:"#666" }}>
                <div style={{ maxWidth:1200, margin:"0 auto" }}>
                  <div className="land-footer-grid" style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1fr", gap:48, marginBottom:48 }}>
                    <div>
                      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:16 }}>
                        <img className="brand-logo-home" style={{ width:36, height:36, borderRadius:9 }} src={window.STATIC_ASSETS.logo_mark} alt="Medicare" />
                        <span style={{ fontFamily:"'Fraunces',serif", fontSize:20, color:"#fff" }}>Medicare</span>
                      </div>
                      <p style={{ fontSize:13.5, lineHeight:1.8, color:"#555", maxWidth:280 }}>Delivering compassionate, world-class healthcare to families across the region since 2001.</p>
                    </div>
                    {[["Quick Links",["Home","About","Services","Doctors","FAQs","Contact"]],["For Users",["Patient Login","Doctor Portal","Receptionist","Admin Panel","Register"]],["Services",["Cardiology","Neurology","Orthopedics","Pediatrics","Emergency"]]].map(([title,links]) => (
                      <div key={title}>
                        <div style={{ fontSize:13, fontWeight:800, color:"#fff", textTransform:"uppercase", letterSpacing:"0.08em", marginBottom:16 }}>{title}</div>
                        {links.map(l => <div key={l} style={{ fontSize:13.5, color:"#555", marginBottom:10, cursor:"pointer", transition:"color 0.18s" }} onMouseOver={e=>e.target.style.color=G.greenLight} onMouseOut={e=>e.target.style.color="#555"}>{l}</div>)}
                      </div>
                    ))}
                  </div>
                  <div style={{ borderTop:"1px solid #1a1a1a", paddingTop:24, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                    <div style={{ fontSize:13 }}>© 2026 Medicare Hospital. All rights reserved.</div>
                    <div style={{ display:"flex", gap:24, fontSize:13 }}>
                      {["Privacy Policy","Terms of Service","Cookie Policy"].map(l => <span key={l} style={{ cursor:"pointer", transition:"color 0.2s" }} onMouseOver={e=>e.target.style.color=G.greenLight} onMouseOut={e=>e.target.style.color="#666"}>{l}</span>)}
                    </div>
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        function App() {
          return (
            <React.Fragment>
              <style>{css}</style>
              <LandingPage onLogin={() => window.location.href = window.FLASK_ROUTES.login} />
            </React.Fragment>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
